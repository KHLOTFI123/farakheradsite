map $http_user_agent $prerender_bot {
    default 0;
    "~*(?i)(googlebot|bingbot|yandex|baiduspider|duckduckbot|slurp|facebookexternalhit|twitterbot|linkedinbot|slackbot|telegrambot|whatsapp|applebot|semrushbot|ahrefsbot|dotbot|mj12bot)" 1;
}

server {
    listen 80;
    listen  [::]:80;
    server_name _;
    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /robots.txt {
        proxy_pass http://backend:8000/robots.txt;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/uploads/ {
        proxy_pass http://backend:8000/api/uploads/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /services {
        error_page 418 = @prerender;
        if ($prerender_bot) {
            return 418;
        }
        try_files /index.html =404;
    }

    location = /services/ {
        error_page 418 = @prerender;
        if ($prerender_bot) {
            return 418;
        }
        try_files /index.html =404;
    }

    location / {
        error_page 418 = @prerender;
        if ($prerender_bot) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location @prerender {
        rewrite ^ /prerender break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header User-Agent $http_user_agent;
    }
}
